<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gabonetako Sari Nagusia — Votación</title>
<style>
  :root{
    --bg:#0f1720;
    --card:#1b2733;
    --card2:#22303f;
    --accent:#e8b04b;
    --accent2:#f2c96b;
    --text:#eef3f8;
    --muted:#93a4b5;
    --danger:#c0453b;
    --ok:#4caf7d;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
    background:radial-gradient(circle at 20% 0%, #1c2a38 0%, #0f1720 60%);
    color:var(--text);
    min-height:100vh;
    padding:24px 16px 80px;
  }
  h1{
    text-align:center;
    font-size:clamp(1.4rem,3vw,2.2rem);
    margin:0 0 4px;
    letter-spacing:.5px;
  }
  h1 span{color:var(--accent);}
  .subtitle{
    text-align:center;
    color:var(--muted);
    margin:0 0 32px;
    font-size:.95rem;
  }
  .container{
    max-width:760px;
    margin:0 auto;
  }
  /* ---------- Pantalla de votantes ---------- */
  .voter-list{
    display:grid;
    gap:12px;
  }
  .voter-btn{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 22px;
    background:linear-gradient(135deg,var(--card),var(--card2));
    border:1px solid rgba(255,255,255,.06);
    border-radius:14px;
    color:var(--text);
    font-size:1.1rem;
    font-weight:600;
    cursor:pointer;
    transition:transform .12s ease, border-color .12s, box-shadow .12s;
    text-align:left;
  }
  .voter-btn:hover{
    transform:translateY(-2px);
    border-color:var(--accent);
    box-shadow:0 8px 20px rgba(0,0,0,.35);
  }
  .voter-btn .arrow{color:var(--accent);font-size:1.2rem;}
  /* ---------- Pantalla de votación ---------- */
  .header-bar{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:22px;
    flex-wrap:wrap;
  }
  .back-btn{
    background:transparent;
    border:1px solid var(--muted);
    color:var(--text);
    padding:8px 14px;
    border-radius:10px;
    cursor:pointer;
    font-size:.9rem;
  }
  .back-btn:hover{border-color:var(--accent);color:var(--accent);}
  .voter-name{
    font-size:1.25rem;
    font-weight:700;
  }
  .voter-name span{color:var(--accent);}
  .section-title{
    font-size:.85rem;
    text-transform:uppercase;
    letter-spacing:1.5px;
    color:var(--muted);
    margin:28px 0 12px;
  }
  /* ---------- Lista de pintxos ---------- */
  .pintxo-list{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .pintxo-item{
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px 16px;
    background:linear-gradient(135deg,var(--card),var(--card2));
    border:1px solid rgba(255,255,255,.06);
    border-radius:12px;
    cursor:grab;
    user-select:none;
    transition:background .12s, border-color .12s, box-shadow .12s;
    position:relative;
  }
  .pintxo-item:active{cursor:grabbing;}
  .pintxo-item.dragging{
    opacity:.35;
    border-color:var(--accent);
  }
  .pintxo-item.drag-over{
    border-color:var(--accent);
    box-shadow:0 0 0 2px var(--accent) inset;
  }
  .pintxo-item.locked{
    background:linear-gradient(135deg,#2a2320,#332a24);
    border-color:rgba(192,69,59,.5);
    cursor:not-allowed;
  }
  .pintxo-item.locked .handle{color:var(--danger);}
  .handle{
    color:var(--muted);
    font-size:1.2rem;
    line-height:1;
  }
  .pos-num{
    min-width:26px;
    font-weight:700;
    color:var(--accent);
    font-size:1.05rem;
  }
  .pintxo-name{flex:1;font-weight:600;font-size:1.05rem;}
  .points{
    background:rgba(232,176,75,.15);
    color:var(--accent2);
    padding:4px 10px;
    border-radius:8px;
    font-weight:700;
    font-size:.9rem;
    min-width:52px;
    text-align:center;
  }
  .lock-tag{
    font-size:.7rem;
    text-transform:uppercase;
    letter-spacing:1px;
    color:var(--danger);
    border:1px solid var(--danger);
    padding:2px 6px;
    border-radius:6px;
  }
  /* ---------- Presentaciones ---------- */
  .presentation-grid{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:10px;
  }
  @media(max-width:520px){
    .presentation-grid{grid-template-columns:1fr;}
  }
  .pres-cell{
    background:var(--card);
    border:1px dashed rgba(255,255,255,.2);
    border-radius:12px;
    padding:14px;
    min-height:64px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:6px;
    cursor:pointer;
    position:relative;
    transition:border-color .12s;
  }
  .pres-cell:hover{border-color:var(--accent);}
  .pres-cell.filled{
    border-style:solid;
    border-color:var(--accent);
    background:linear-gradient(135deg,var(--card),var(--card2));
  }
  .pres-label{
    font-size:.7rem;
    text-transform:uppercase;
    letter-spacing:1px;
    color:var(--muted);
  }
  .pres-value{
    font-weight:700;
    font-size:1rem;
  }
  .pres-value.empty{color:var(--muted);font-weight:400;font-style:italic;}
  .pres-cell select{
    position:absolute;
    inset:0;
    opacity:0;
    cursor:pointer;
    width:100%;
    height:100%;
  }
  .pres-cell.filled select{cursor:pointer;}
  /* ---------- Botón guardar ---------- */
  .save-btn{
    margin-top:34px;
    width:100%;
    padding:16px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    color:#1a1305;
    font-weight:800;
    font-size:1.05rem;
    border:none;
    border-radius:14px;
    cursor:pointer;
    letter-spacing:.5px;
    transition:transform .12s, box-shadow .12s;
  }
  .save-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 24px rgba(232,176,75,.35);
  }
  .save-btn:disabled{
    opacity:.4;
    cursor:not-allowed;
    transform:none;
    box-shadow:none;
  }
  .toast{
    position:fixed;
    bottom:24px;
    left:50%;
    transform:translateX(-50%) translateY(120%);
    background:var(--ok);
    color:#06210f;
    padding:12px 22px;
    border-radius:12px;
    font-weight:700;
    transition:transform .3s ease;
    z-index:50;
  }
  .toast.show{transform:translateX(-50%) translateY(0);}
  .hidden{display:none !important;}
</style>
</head>
<body>
<div class="container">

  <!-- ============ PANTALLA 1: VOTANTES ============ -->
  <section id="screen-voters">
    <h1>Gabonetako <span>Sari Nagusia</span></h1>
    <p class="subtitle">Selecciona quién va a votar</p>
    <div class="voter-list" id="voterList"></div>
  </section>

  <!-- ============ PANTALLA 2: VOTACIÓN ============ -->
  <section id="screen-vote" class="hidden">
    <div class="header-bar">
      <button class="back-btn" id="backBtn">← Volver</button>
      <div class="voter-name">Votando: <span id="currentVoterName"></span></div>
    </div>

    <div class="section-title">Ordena los pintxos (mejor → peor)</div>
    <div class="pintxo-list" id="pintxoList"></div>

    <div class="section-title">Mejores presentaciones</div>
    <div class="presentation-grid" id="presentationGrid"></div>

    <button class="save-btn" id="saveBtn">Guardar votación</button>
  </section>

</div>

<div class="toast" id="toast">✅ Votación guardada (localmente)</div>

<script>
/* =========================================================
   DATOS
   ========================================================= */
const ALL_VOTERS = [
  "Abuela","Josefina","Juan Mari","Jon","Mikel",
  "Ana Luisa","Javi","Iosu","Yaiza"
];
// Orden alfabético (localeCompare en castellano)
const voters = [...ALL_VOTERS].sort((a,b)=>a.localeCompare(b,"es"));

const ABUELA = "Abuela";
const cooks = [...ALL_VOTERS]
  .filter(n => n !== ABUELA)
  .sort((a,b)=>a.localeCompare(b,"es"));

/* =========================================================
   ESTADO
   ========================================================= */
let currentVoter = null;
let currentOrder = [];      // orden actual de pintxos
let currentPresentations = [null,null,null]; // 3 celdas
const STORAGE_KEY = "gabonetako-votos-v1";

/* =========================================================
   PANTALLA 1: RENDER VOTANTES
   ========================================================= */
const voterListEl = document.getElementById("voterList");

function renderVoters(){
  voterListEl.innerHTML = "";
  voters.forEach(name=>{
    const btn = document.createElement("button");
    btn.className = "voter-btn";
    btn.innerHTML = `<span>${name}</span><span class="arrow">›</span>`;
    btn.addEventListener("click", ()=>startVote(name));
    voterListEl.appendChild(btn);
  });
}

/* =========================================================
   NAVEGACIÓN
   ========================================================= */
function startVote(voter){
  currentVoter = voter;
  document.getElementById("currentVoterName").textContent = voter;

  // Orden inicial alfabético de los pintxos
  currentOrder = [...cooks];

  // Si NO es la abuela, su propio nombre debe ir bloqueado al final
  if(voter !== ABUELA){
    currentOrder = currentOrder.filter(n => n !== voter);
    currentOrder.push(voter);
  }

  currentPresentations = [null,null,null];

  document.getElementById("screen-voters").classList.add("hidden");
  document.getElementById("screen-vote").classList.remove("hidden");

  renderPintxos();
  renderPresentations();
  updateSaveBtn();
}

document.getElementById("backBtn").addEventListener("click", ()=>{
  document.getElementById("screen-vote").classList.add("hidden");
  document.getElementById("screen-voters").classList.remove("hidden");
});

/* =========================================================
   LISTA DE PINTXOS (drag & drop tipo insertar)
   ========================================================= */
const pintxoListEl = document.getElementById("pintxoList");
let draggedEl = null;
let draggedName = null;

function renderPintxos(){
  pintxoListEl.innerHTML = "";
  const total = currentOrder.length;

  currentOrder.forEach((name, index)=>{
    const points = total - index; // 8,7,...,1
    const isLocked = (currentVoter !== ABUELA) && (index === total - 1) && (name === currentVoter);

    const item = document.createElement("div");
    item.className = "pintxo-item" + (isLocked ? " locked" : "");
    item.dataset.name = name;
    item.draggable = !isLocked;

    item.innerHTML = `
      <span class="handle">${isLocked ? "🔒" : "⠿"}</span>
      <span class="pos-num">${index+1}º</span>
      <span class="pintxo-name">${name}</span>
      ${isLocked ? '<span class="lock-tag">Bloqueado</span>' : ''}
      <span class="points">${points} pts</span>
    `;

    if(!isLocked){
      item.addEventListener("dragstart", onDragStart);
      item.addEventListener("dragend", onDragEnd);
      item.addEventListener("dragover", onDragOver);
      item.addEventListener("dragleave", onDragLeave);
      item.addEventListener("drop", onDrop);
    }

    pintxoListEl.appendChild(item);
  });
}

function onDragStart(e){
  draggedEl = this;
  draggedName = this.dataset.name;
  this.classList.add("dragging");
  e.dataTransfer.effectAllowed = "move";
  // Firefox necesita setData
  e.dataTransfer.setData("text/plain", draggedName);
}

function onDragEnd(e){
  this.classList.remove("dragging");
  document.querySelectorAll(".pintxo-item").forEach(el=>el.classList.remove("drag-over"));
  draggedEl = null;
  draggedName = null;
}

function onDragOver(e){
  e.preventDefault();
  e.dataTransfer.dropEffect = "move";
  if(this === draggedEl) return;
  if(this.classList.contains("locked")) return; // no se puede soltar sobre bloqueado
  this.classList.add("drag-over");
}

function onDragLeave(e){
  this.classList.remove("drag-over");
}

function onDrop(e){
  e.preventDefault();
  this.classList.remove("drag-over");
  if(!draggedEl || this === draggedEl) return;
  if(this.classList.contains("locked")) return;

  const targetName = this.dataset.name;

  // Reordenación tipo "insertar": quitar el arrastrado y meterlo en la posición del destino
  const fromIndex = currentOrder.indexOf(draggedName);
  let toIndex = currentOrder.indexOf(targetName);

  if(fromIndex === -1 || toIndex === -1) return;

  // Si el destino es la última posición y el votante no es la abuela,
  // no permitir que su propio nombre deje de estar bloqueado abajo.
  // (El nombre bloqueado no es arrastrable ni acepta drop, así que ya está protegido,
  //  pero nos aseguramos de que el arrastrado no acabe debajo de él.)
  if(currentVoter !== ABUELA){
    const lockedName = currentVoter;
    const lockedIndex = currentOrder.indexOf(lockedName);
    // El nombre bloqueado siempre debe quedar el último
    if(lockedIndex !== currentOrder.length - 1){
      // reubicarlo al final (por seguridad)
      currentOrder.splice(lockedIndex,1);
      currentOrder.push(lockedName);
      // recalcular índices
      const newFrom = currentOrder.indexOf(draggedName);
      const newTo = currentOrder.indexOf(targetName);
      if(newFrom !== -1 && newTo !== -1){
        reorderInsert(newFrom, newTo);
      }
    } else {
      reorderInsert(fromIndex, toIndex);
    }
  } else {
    reorderInsert(fromIndex, toIndex);
  }

  renderPintxos();
  updateSaveBtn();
}

/* Mueve el elemento de fromIndex a toIndex desplazando el resto */
function reorderInsert(fromIndex, toIndex){
  const [moved] = currentOrder.splice(fromIndex,1);
  currentOrder.splice(toIndex,0,moved);
}

/* =========================================================
   PRESENTACIONES (3 celdas con select)
   ========================================================= */
const presentationGridEl = document.getElementById("presentationGrid");
const PRES_LABELS = ["Mejor presentación 1","Mejor presentación 2","Mejor presentación 3"];

function renderPresentations(){
  presentationGridEl.innerHTML = "";
  PRES_LABELS.forEach((label, i)=>{
    const cell = document.createElement("div");
    cell.className = "pres-cell" + (currentPresentations[i] ? " filled" : "");

    const lbl = document.createElement("div");
    lbl.className = "pres-label";
    lbl.textContent = label;
    cell.appendChild(lbl);

    const val = document.createElement("div");
    val.className = "pres-value" + (currentPresentations[i] ? "" : " empty");
    val.textContent = currentPresentations[i] || "Seleccionar…";
    cell.appendChild(val);

    const select = document.createElement("select");
    const emptyOpt = document.createElement("option");
    emptyOpt.value = "";
    emptyOpt.textContent = "—";
    select.appendChild(emptyOpt);

    cooks.forEach(name=>{
      const opt = document.createElement("option");
      opt.value = name;
      opt.textContent = name;
      // No permitir seleccionar el mismo en otra celda
      if(currentPresentations.includes(name) && currentPresentations[i] !== name){
        opt.disabled = true;
      }
      if(currentPresentations[i] === name) opt.selected = true;
      select.appendChild(opt);
    });

    select.addEventListener("change", ()=>{
      const chosen = select.value || null;
      // Si ya estaba en otra celda, la limpiamos
      if(chosen){
        currentPresentations = currentPresentations.map((v,idx)=> idx!==i && v===chosen ? null : v);
      }
      currentPresentations[i] = chosen;
      renderPresentations();
      updateSaveBtn();
    });

    cell.appendChild(select);
    presentationGridEl.appendChild(cell);
  });
}

/* =========================================================
   BOTÓN GUARDAR
   ========================================================= */
const saveBtn = document.getElementById("saveBtn");

function allPresentationsFilled(){
  return currentPresentations.every(v => v !== null);
}

function updateSaveBtn(){
  saveBtn.disabled = !allPresentationsFilled();
}

saveBtn.addEventListener("click", ()=>{
  if(!allPresentationsFilled()) return;

  const votes = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
  votes[currentVoter] = {
    order: [...currentOrder],
    presentations: [...currentPresentations],
    timestamp: new Date().toISOString()
  };
  localStorage.setItem(STORAGE_KEY, JSON.stringify(votes));

  showToast();
});

function showToast(){
  const t = document.getElementById("toast");
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 2400);
}

/* =========================================================
   INIT
   ========================================================= */
renderVoters();
</script>
</body>
</html>
