<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gabonetako Sari Nagusia — Votación</title>
<style>
  :root{
    --bg:#f3ece1;
    --card:#fbf7f0;
    --card2:#f6efe4;
    --accent:#c9a26b;
    --accent2:#d9b98a;
    --text:#3a342c;
    --muted:#8a7f70;
    --danger:#b07a6f;
    --ok:#8fb59a;
    --border:#e5dccd;
    --gold:#e6c878;
    --silver:#cfd3d6;
    --bronze:#d6a37a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    padding:24px 16px 80px;
  }
  .page-header{
    text-align:center;
    margin:0 0 28px;
  }
  h1{
    text-align:center;
    font-size:clamp(1.4rem,3vw,2.2rem);
    margin:0 0 6px;
    letter-spacing:.5px;
    color:var(--text);
  }
  h1 span{color:var(--accent);}
  .edition-subtitle{
    font-size:.95rem;
    font-weight:700;
    letter-spacing:2.5px;
    text-transform:uppercase;
    color:var(--muted);
    margin:0 0 14px;
  }
  .results-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    padding:10px 20px;
    background:var(--card);
    border:1px solid var(--accent);
    color:var(--text);
    font-size:.92rem;
    font-weight:700;
    border-radius:12px 4px 12px 4px;
    cursor:pointer;
    transition:transform .12s ease, background-color .12s, box-shadow .12s;
  }
  .results-btn:hover{
    transform:translateY(-2px);
    background:var(--accent2);
    color:#4a3a1f;
    box-shadow:0 6px 16px rgba(120,100,70,.14);
  }
  .container{max-width:980px;margin:0 auto;}

  .home-layout{
    display:grid;
    grid-template-columns: 1fr 300px;
    gap:22px;
    align-items:start;
  }
  @media(max-width:760px){
    .home-layout{grid-template-columns:1fr;}
  }

  .section-title{
    font-size:.85rem;text-transform:uppercase;letter-spacing:1.5px;
    color:var(--muted);margin:0 0 12px;
  }

  .voter-grid{
    display:flex;flex-direction:column;gap:10px;
  }
  .voter-btn{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:14px 18px;
    background:var(--card);
    border:1px solid var(--border);
    color:var(--text);
    font-size:1rem;font-weight:600;
    cursor:pointer;
    transition:transform .12s ease, border-color .12s, box-shadow .12s;
    text-align:left;
  }
  .voter-btn:nth-child(4n+1){border-radius:14px 4px 14px 4px;}
  .voter-btn:nth-child(4n+2){border-radius:4px 14px 4px 14px;}
  .voter-btn:nth-child(4n+3){border-radius:14px 4px 14px 4px;}
  .voter-btn:nth-child(4n+4){border-radius:4px 14px 4px 14px;}
  .voter-btn:hover{
    transform:translateY(-2px);
    border-color:var(--accent);
    box-shadow:0 6px 16px rgba(120,100,70,.12);
  }
  .voter-main-label{
    flex:1;
  }
  .voter-actions{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .vote-tick{
    font-size:1.15rem;
    font-weight:800;
    color:#2f6b47;
    background:none;
    border:none;
    padding:0;
    line-height:1;
  }
  .delete-vote-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:32px;
    height:32px;
    padding:4px;
    background:var(--card2);
    border:1px solid var(--border);
    border-radius:8px 2px 8px 2px;
    cursor:pointer;
    transition:border-color .12s, background-color .12s, transform .12s;
  }
  .delete-vote-btn:hover{
    border-color:var(--danger);
    background:#f7eae7;
    transform:scale(1.05);
  }
  .delete-vote-btn img{
    width:20px;
    height:20px;
    object-fit:contain;
    display:block;
  }
  .voter-btn .arrow{color:var(--accent);font-size:1.1rem;}

  .history-list{
    display:flex;flex-direction:column;gap:10px;
  }
  .history-card{
    display:flex;flex-direction:column;gap:6px;
    padding:14px 16px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px 4px 12px 4px;
    cursor:pointer;
    transition:transform .12s, border-color .12s, box-shadow .12s;
    text-align:left;
  }
  .history-card:hover{
    transform:translateY(-2px);
    border-color:var(--accent);
    box-shadow:0 6px 16px rgba(120,100,70,.12);
  }
  .history-edition{
    font-size:1.05rem;font-weight:700;color:var(--text);
  }
  .history-winner{
    font-size:.85rem;color:var(--muted);
  }
  .history-winner strong{color:var(--accent);font-weight:700;}

  .header-bar{
    display:flex;align-items:center;gap:14px;
    margin-bottom:22px;flex-wrap:wrap;
  }
  .back-btn{
    background:transparent;
    border:1px solid var(--muted);
    color:var(--text);
    padding:8px 14px;
    border-radius:10px 3px 10px 3px;
    cursor:pointer;font-size:.9rem;
  }
  .back-btn:hover{border-color:var(--accent);color:var(--accent);}
  .voter-name{font-size:1.25rem;font-weight:700;}
  .voter-name span{color:var(--accent);}

  .vote-layout{
    display:grid;
    grid-template-columns: 1.55fr 1fr;
    gap:22px;
    align-items:start;
  }
  @media(max-width:680px){
    .vote-layout{grid-template-columns:1fr;}
  }

  .pintxo-list{
    display:flex;flex-direction:column;gap:8px;
    position:relative;
  }
  .pintxo-item{
    display:flex;align-items:center;gap:14px;
    padding:14px 16px 14px 22px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px 4px 12px 4px;
    cursor:grab;
    user-select:none;
    -webkit-user-select:none;
    touch-action:none;
    will-change:background-color, border-color;
    transition:background-color .15s, border-color .15s, box-shadow .15s;
    position:relative;
    overflow:hidden;
  }
  .pintxo-item.dragging{
    background:var(--card2);
    border-color:var(--accent);
    box-shadow:0 6px 18px rgba(120,100,70,.18);
    cursor:grabbing;
    z-index:10;
  }
  .pintxo-item.locked{
    background:#f1e6d8;
    border-color:#d8c4a8;
    cursor:not-allowed;
  }

  .medal-stripe{
    position:absolute;
    left:0;top:0;bottom:0;
    width:6px;
    border-radius:12px 0 0 4px;
  }
  .medal-stripe.gold{background:var(--gold);}
  .medal-stripe.silver{background:var(--silver);}
  .medal-stripe.bronze{background:var(--bronze);}

  .pos-num{
    min-width:26px;font-weight:700;
    color:var(--accent);font-size:1.05rem;
  }
  .pintxo-name{flex:1;font-weight:600;font-size:1.05rem;}
  .points{
    background:#ecdfc9;color:#8a6d3b;
    padding:4px 10px;
    border-radius:8px 2px 8px 2px;
    font-weight:700;font-size:.9rem;
    min-width:52px;text-align:center;
  }
  .lock-tag{
    font-size:.7rem;text-transform:uppercase;letter-spacing:1px;
    color:var(--danger);border:1px solid var(--danger);
    padding:2px 6px;border-radius:6px 2px 6px 2px;
  }

  .presentation-col{
    display:flex;flex-direction:column;
  }
  .presentation-list{
    display:flex;flex-direction:column;gap:18px;
  }
  .pres-cell{
    background:var(--card);
    border:1px dashed #d8cdbc;
    border-radius:12px 4px 12px 4px;
    padding:14px;
    min-height:64px;
    display:flex;flex-direction:column;justify-content:center;gap:6px;
    cursor:pointer;position:relative;
    transition:border-color .12s;
  }
  .pres-cell:hover{border-color:var(--accent);}
  .pres-cell.filled{
    border-style:solid;border-color:var(--accent);
    background:var(--card2);
  }
  .pres-label{
    font-size:.7rem;text-transform:uppercase;letter-spacing:1px;
    color:var(--muted);
    display:flex;justify-content:space-between;align-items:center;
  }
  .pres-points{
    background:#ecdfc9;color:#8a6d3b;
    padding:1px 6px;border-radius:6px 2px 6px 2px;
    font-weight:700;font-size:.7rem;
    letter-spacing:.5px;
  }
  .pres-value{font-weight:700;font-size:1rem;}
  .pres-value.empty{color:var(--muted);font-weight:400;font-style:italic;}
  .pres-cell select{
    position:absolute;inset:0;opacity:0;
    cursor:pointer;width:100%;height:100%;
  }

  .save-btn{
    margin-top:34px;width:100%;padding:16px;
    background:var(--accent2);color:#4a3a1f;
    font-weight:800;font-size:1.05rem;
    border:none;
    border-radius:14px 4px 14px 4px;
    cursor:pointer;
    letter-spacing:.5px;
    transition:transform .12s, box-shadow .12s, background .12s;
  }
  .save-btn:hover{
    transform:translateY(-2px);
    background:var(--accent);
    box-shadow:0 8px 20px rgba(120,100,70,.18);
  }
  .save-btn:disabled{
    opacity:.45;cursor:not-allowed;
    transform:none;box-shadow:none;
  }
  .toast{
    position:fixed;bottom:24px;left:50%;
    transform:translateX(-50%) translateY(120%);
    background:var(--ok);color:#2a3f31;
    padding:12px 22px;
    border-radius:12px 4px 12px 4px;
    font-weight:700;transition:transform .3s ease;
    z-index:120;
  }
  .toast.show{transform:translateX(-50%) translateY(0);}
  .hidden{display:none !important;}

  .history-view{
    max-width:800px;margin:0 auto;
  }
  .results-top-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
    margin:0 0 6px;
  }
  .history-view h2{
    font-size:1.6rem;margin:0;
  }
  .history-view h2 span{color:var(--accent);}
  .history-view .date-line{
    color:var(--muted);margin:0 0 20px;font-size:.95rem;
  }
  .history-view .winner-line{
    color:var(--muted);margin:0 0 24px;font-size:1rem;
  }
  .history-view .winner-line strong{color:var(--accent);}

  .results-tabs{
    display:inline-flex;
    align-items:center;
    background:var(--card2);
    border:1px solid var(--border);
    border-radius:12px 4px 12px 4px;
    padding:4px;
    gap:4px;
  }
  .results-tab-btn{
    padding:7px 14px;
    background:transparent;
    color:var(--muted);
    border:1px solid transparent;
    border-radius:9px 3px 9px 3px;
    font-size:.9rem;
    font-weight:700;
    cursor:pointer;
    transition:background-color .14s, color .14s, border-color .14s, box-shadow .14s;
  }
  .results-tab-btn:hover{
    color:var(--text);
  }
  .results-tab-btn.active{
    background:#fffdf9;
    color:var(--text);
    border-color:var(--accent);
    box-shadow:0 2px 8px rgba(120,100,70,.12);
  }

  .history-placeholder{
    background:var(--card);
    border:1px dashed var(--border);
    border-radius:12px 4px 12px 4px;
    padding:20px;
    text-align:center;
    color:var(--muted);
    font-style:italic;
    margin-bottom:32px;
  }

  .reveal-controls{
    display:flex;
    justify-content:center;
    margin:10px 0 28px;
  }
  .reveal-next-btn{
    padding:12px 26px;
    background:var(--accent2);
    color:#4a3a1f;
    border:1px solid var(--accent);
    border-radius:12px 4px 12px 4px;
    font-size:1rem;
    font-weight:800;
    cursor:pointer;
    transition:transform .12s, background-color .12s, box-shadow .12s;
  }
  .reveal-next-btn:hover{
    transform:translateY(-2px);
    background:var(--accent);
    box-shadow:0 6px 16px rgba(120,100,70,.16);
  }

  .results-table{
    width: 100%;
    max-width: 540px;
    margin: 16px auto 20px auto;
    border-collapse:separate;
    border-spacing:0;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px 4px 12px 4px;
    overflow:hidden;
  }
  .results-table th{
    background:var(--card2);
    color:var(--text);
    text-align:left;
    padding:14px 16px;
    font-weight:600;
    font-size:.85rem;
    text-transform:uppercase;
    letter-spacing:1px;
    border-bottom:2px solid var(--border);
  }
  .results-table th:first-child{ border-top-left-radius:12px; }
  .results-table th:last-child{ border-top-right-radius:4px; }
  
  .results-table td{
    padding:14px 16px;
    border-bottom:1px solid var(--border);
    font-size:1rem;
  }
  .results-table tr:last-child td{ border-bottom:none; }
  
  .results-table tr{ position:relative; }
  
  .results-table tr.medal-gold td:first-child{ border-left:6px solid var(--gold); }
  .results-table tr.medal-silver td:first-child{ border-left:6px solid var(--silver); }
  .results-table tr.medal-bronze td:first-child{ border-left:6px solid var(--bronze); }
  .results-table tr:not(.medal-gold):not(.medal-silver):not(.medal-bronze) td:first-child{ border-left:6px solid transparent; }

  .results-table .col-pos { font-weight:700; color:var(--muted); width: 80px; text-align:center; }
  .results-table .col-name { font-weight:600; text-align:center; color:var(--text); }
  .results-table .col-name.mystery { color:var(--muted); letter-spacing:2px; font-style:italic; }
  .results-table .col-name.gold-text { color:#9c7424; font-weight:800; }
  
  .results-table .col-score { font-weight:700; color:#4f825e; text-align:right; }

  .results-table tr:not(.medal-gold):not(.medal-silver):not(.medal-bronze) .col-name:not(.mystery) { color:var(--text); font-weight:600; }

  .winner-banner-box{
    position:relative;
    z-index:105;
    max-width:640px;
    margin:20px auto 28px;
    padding:26px 28px;
    background:linear-gradient(135deg, #fffdf9 0%, #f5e6c4 100%);
    border:2px solid var(--accent);
    border-radius:16px 6px 16px 6px;
    text-align:center;
    box-shadow:0 14px 34px rgba(40, 30, 15, 0.34);
  }
  .winner-banner-box h3{
    margin:0 0 8px;
    font-size:clamp(1.4rem, 3.2vw, 2.05rem);
    color:#8f6519;
    letter-spacing:.6px;
  }
  .winner-banner-box p{
    margin:0;
    font-size:1.1rem;
    font-weight:700;
    color:var(--text);
  }

  .fireworks-overlay{
    position:fixed;
    inset:0;
    z-index:90;
    pointer-events:none;
    overflow:hidden;
    background:rgba(20, 16, 12, 0.24);
  }
  .firework-scatter{
    position:absolute;
    inset:0 0 140px 0;
  }
  .firework-scattered-gif{
    --base-size: clamp(110px, 16vw, 185px);
    --scale: 1;
    position:absolute;
    width:calc(var(--base-size) * var(--scale));
    height:calc(var(--base-size) * var(--scale));
    object-fit:contain;
    transform:translate(-50%, -50%);
  }
  .firework-scattered-gif.scale-1-5{
    --scale: 1.5;
  }
  .firework-scattered-gif.scale-2{
    --scale: 2;
  }
  .fireworks-bottom-row{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    height:150px;
    display:grid;
    grid-template-columns:repeat(10, 1fr);
    align-items:end;
    padding:0;
    margin:0;
    gap:0;
  }
  .fireworks-bottom-row img{
    width:100%;
    height:150px;
    object-fit:contain;
    object-position:bottom center;
    display:block;
    margin-top:auto;
  }
  .close-fireworks-btn{
    position:fixed;
    top:18px;
    right:18px;
    z-index:110;
    pointer-events:auto;
    padding:9px 16px;
    background:var(--card);
    color:var(--text);
    border:1px solid var(--accent);
    border-radius:10px 3px 10px 3px;
    font-weight:700;
    font-size:.9rem;
    cursor:pointer;
    box-shadow:0 6px 16px rgba(0,0,0,.22);
  }
  .close-fireworks-btn:hover{
    background:var(--accent2);
    color:#4a3a1f;
  }

  .gallery-title {
    font-size:.85rem; text-transform:uppercase; letter-spacing:1.5px;
    color:var(--muted); margin: 0 0 16px;
  }
  .gallery-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 16px;
  }
  .photo-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px 4px 12px 4px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    cursor: pointer; /* Cursor pointer para indicar que es clickable */
  }
  
  .photo-img-wrapper {
    width: 100%;
    aspect-ratio: 1 / 1;
    background: var(--card2);
    border-bottom: 1px solid var(--border);
    overflow: hidden;
  }
  .photo-img-wrapper img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform .2s; /* Efecto hover */
  }
  .photo-card:hover .photo-img-wrapper img {
    transform: scale(1.05);
  }

  .photo-author {
    padding: 12px 10px;
    font-weight: 600;
    font-size: .95rem;
    text-align: center;
    background: var(--card);
  }

  /* ---------- Lightbox (Visor de fotos grande) ---------- */
  .lightbox-overlay {
    position: fixed;
    inset: 0;
    z-index: 200;
    background: rgba(20, 16, 12, 0.92);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }
  .lightbox-overlay.active {
    opacity: 1;
    pointer-events: auto;
  }
  .lightbox-content {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    user-select: none;
  }
  .lightbox-img-wrapper {
    position: relative;
    max-width: 90vw;
    max-height: 80vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .lightbox-img {
    max-width: 100%;
    max-height: 80vh;
    object-fit: contain;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    border-radius: 8px;
    transition: opacity 0.2s ease;
  }
  .lightbox-author {
    margin-top: 16px;
    color: #fff;
    font-size: 1.2rem;
    font-weight: 600;
    text-align: center;
  }
  .lightbox-close-btn {
    position: fixed;
    top: 20px;
    right: 20px;
    background: transparent;
    border: none;
    color: #fff;
    font-size: 2.5rem;
    cursor: pointer;
    opacity: 0.7;
    transition: opacity 0.2s;
    z-index: 210;
    padding: 10px;
  }
  .lightbox-close-btn:hover {
    opacity: 1;
  }
  .lightbox-nav-btn {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(255,255,255,0.1);
    border: none;
    color: #fff;
    font-size: 2rem;
    padding: 20px 15px;
    cursor: pointer;
    border-radius: 8px;
    transition: background-color 0.2s;
    z-index: 210;
  }
  .lightbox-nav-btn:hover {
    background: rgba(255,255,255,0.3);
  }
  .lightbox-nav-btn.prev { left: 20px; }
  .lightbox-nav-btn.next { right: 20px; }
  @media(max-width:600px){
    .lightbox-nav-btn {
      font-size: 1.5rem;
      padding: 15px 10px;
    }
  }
</style>
</head>
<body>
<div class="container">

  <section id="screen-home">
    <header class="page-header">
      <h1>Gabonetako <span>Sari Nagusia</span></h1>
      <div class="edition-subtitle">VI. EDIZIOA</div>
      <button class="results-btn" id="openResultsBtn" type="button">Ver resultados</button>
    </header>

    <div class="home-layout">
      <div class="home-main">
        <div class="section-title">Votantes</div>
        <div class="voter-grid" id="voterList"></div>
      </div>

      <aside class="home-history">
        <div class="section-title">Aurreko edizioak</div>
        <div class="history-list" id="historyList"></div>
      </aside>
    </div>
  </section>

  <section id="screen-vote" class="hidden">
    <div class="header-bar">
      <button class="back-btn" id="backBtn" type="button">Volver</button>
      <div class="voter-name">Votando: <span id="currentVoterName"></span></div>
    </div>

    <div class="vote-layout">
      <div class="pintxo-col">
        <div class="section-title">Pintxoak</div>
        <div class="pintxo-list" id="pintxoList"></div>
      </div>

      <div class="presentation-col">
        <div class="section-title">Presentaciones</div>
        <div class="presentation-list" id="presentationGrid"></div>
      </div>
    </div>

    <button class="save-btn" id="saveBtn" type="button">Guardar votación</button>
  </section>

  },

    ranking: []

    edition:"I. Edizioa", 
    date:"2021/12/25",
    winner:"Mikel",

];

let currentVoter = null;
let currentOrder = [];
let currentPresentations = [null,null,null];
const STORAGE_KEY = "gabonetako-votos-v1";

function getSavedVotes(){
  try{
    return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
  }catch{
    return {};
  }
}

function deleteVote(voterName, event){
  event.stopPropagation();
  const votes = getSavedVotes();
  if(Object.prototype.hasOwnProperty.call(votes, voterName)){
    delete votes[voterName];
    localStorage.setItem(STORAGE_KEY, JSON.stringify(votes));
    renderVoters();
    showToast(`Voto de ${voterName} eliminado`);
  }
}

const voterListEl = document.getElementById("voterList");
function renderVoters(){
  const votes = getSavedVotes();
  voterListEl.innerHTML = "";

  voters.forEach(name=>{
    const hasVoted = Boolean(votes[name]);
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "voter-btn";

    const labelSpan = document.createElement("span");
    labelSpan.className = "voter-main-label";
    labelSpan.textContent = name;
    btn.appendChild(labelSpan);

    const actionsDiv = document.createElement("div");
    actionsDiv.className = "voter-actions";

    if(hasVoted){
      const tickSpan = document.createElement("span");
      tickSpan.className = "vote-tick";
      tickSpan.title = "Voto guardado";
      tickSpan.textContent = "✓";
      actionsDiv.appendChild(tickSpan);

      const delBtn = document.createElement("button");
      delBtn.type = "button";
      delBtn.className = "delete-vote-btn";
      delBtn.title = `Borrar voto de ${name}`;
      delBtn.setAttribute("aria-label", `Borrar voto de ${name}`);

      const trashImg = document.createElement("img");
      trashImg.src = "./Logoak/Basura.png";
      trashImg.alt = "Borrar";
      trashImg.onerror = function(){
        if(!this.dataset.triedLower){
          this.dataset.triedLower = "1";
          this.src = "./Logoak/basura.png";
        } else {
          this.replaceWith(document.createTextNode("×"));
        }
      };
      delBtn.appendChild(trashImg);

      delBtn.addEventListener("click", (e)=>deleteVote(name, e));
      actionsDiv.appendChild(delBtn);
    }

    const arrowSpan = document.createElement("span");
    arrowSpan.className = "arrow";
    arrowSpan.textContent = "›";
    actionsDiv.appendChild(arrowSpan);

    btn.appendChild(actionsDiv);
    btn.addEventListener("click", ()=>startVote(name));
    voterListEl.appendChild(btn);
  });
}

const historyListEl = document.getElementById("historyList");
function renderHistory(){
  historyListEl.innerHTML = "";
  HISTORY.forEach(entry=>{
    const card = document.createElement("button");
    card.type = "button";
    card.className = "history-card";
    card.innerHTML = `

const screenVote = document.getElementById("screen-vote");

function startVote(voter){
  currentVoter = voter;
  document.getElementById("currentVoterName").textContent = voter;

  currentOrder = [...cooks];
  if(voter !== ABUELA){
    currentOrder = currentOrder.filter(n => n !== voter);
    currentOrder.push(voter);
  }
  currentPresentations = [null,null,null];

  renderPintxos();
  renderPresentations();
  updateSaveBtn();

}

document.getElementById("backBtn").addEventListener("click", ()=>{
  renderVoters();
  showScreen(screenHome);
});

const PRES_LABELS = ["Mejor presentación 1","Mejor presentación 2","Mejor presentación 3"];
const PRES_POINTS = [3,2,1];

let activeResultsTab = "pintxoa";
let liveRankingData = [];
let revealedIndices = new Set();
let winnerCelebrated = false;

function computeRankingForTab(tabMode){
  const votes = getSavedVotes();
  const validVoters = Object.keys(votes).filter(v => ALL_VOTERS.includes(v));
  const scores = {};
  cooks.forEach(c => { scores[c] = 0; });

  validVoters.forEach(voterName => {
    const v = votes[voterName];
    
    if(tabMode === "pintxoa" && Array.isArray(v.order)){
      const total = v.order.length;
      v.order.forEach((cookName, idx) => {
        if(Object.prototype.hasOwnProperty.call(scores, cookName)){
          scores[cookName] += (total - idx);
        }
      });
    }
    
    if(tabMode === "presentacion" && Array.isArray(v.presentations)){
      v.presentations.forEach((cookName, idx) => {
        if(cookName && Object.prototype.hasOwnProperty.call(scores, cookName)){
          scores[cookName] += (PRES_POINTS[idx] || 0);
        }
      });
    }
  });

  const sorted = Object.entries(scores)
    .map(([name, score]) => ({ name, score }))
    .sort((a,b) => b.score - a.score || a.name.localeCompare(b.name, "es"));

  return {
    votesCount: validVoters.length,
    ranking: sorted
  };
}

function revealNextPosition(){
  if(liveRankingData.length === 0) return;

  let unrevealed = [];
  for(let i = liveRankingData.length - 1; i >= 0; i--){
    if(!revealedIndices.has(i)){
      unrevealed.push(i);
    }
  }

  if(unrevealed.length === 0) return;

  if(unrevealed.length <= 2){
    unrevealed.forEach(idx => revealedIndices.add(idx));
  } else {
    revealedIndices.add(unrevealed[0]);
  }

  renderLiveResultsTable();
}

function renderLiveResultsTable(){
  const contentEl = document.getElementById("liveResultsContent");

  if(liveRankingData.length === 0){
    contentEl.innerHTML = `<div class="history-placeholder">Todavía no hay votaciones guardadas en esta edición.</div>`;
    return;
  }

  const medals = ["gold","silver","bronze"];
  const total = liveRankingData.length;
  const remainingCount = total - revealedIndices.size;

  const topTwoRevealed = total >= 2 && revealedIndices.has(0) && revealedIndices.has(1);
  const allRevealed = remainingCount === 0;

  let controlsHTML = "";
  if(!allRevealed){
    controlsHTML = `
      <div class="reveal-controls">
        <button class="reveal-next-btn" id="revealNextBtn" type="button">
          Hurrengoa
        </button>
      </div>
    `;
  }

  let bannerHTML = "";
  if(topTwoRevealed && total > 0){
    const winnerName = liveRankingData[0].name;
    if(activeResultsTab === "pintxoa"){
      bannerHTML = `
        <div class="winner-banner-box">
          <h3>ZORIONAK ${winnerName.toUpperCase()}!</h3>
          <p>Gabonetako Sari Nagusia VI. edizioaren irabazlea!</p>
        </div>
      `;
    } else {
      bannerHTML = `
        <div class="winner-banner-box">
          <h3>ZORIONAK ${winnerName.toUpperCase()}!</h3>
          <p>Presentazio hoberenaren irabazlea!</p>
        </div>
      `;
    }
  }

  let tableHTML = `
    <table class="results-table">
      <thead>
        <tr>
          <th style="text-align:center">Posición</th>
          <th style="text-align:center">Pintxo</th>
          <th style="text-align:right">Puntuación</th>
        </tr>
      </thead>
      <tbody>
  `;

  liveRankingData.forEach((row, idx) => {
    const isRevealed = revealedIndices.has(idx);
    const medal = isRevealed ? (medals[idx] || null) : null;
    const medalClass = medal ? `medal-${medal}` : '';
    const nameClass = !isRevealed
      ? 'mystery'
      : (medal === 'gold' ? 'gold-text' : '');
    const displayName = isRevealed ? row.name : '???';

    tableHTML += `
      <tr class="${medalClass}">
        <td class="col-pos">${idx + 1}º</td>
        <td class="col-name ${nameClass}">${displayName}</td>
        <td class="col-score">${row.score} puntos</td>
      </tr>
    `;
  });

  tableHTML += `</tbody></table>`;
  contentEl.innerHTML = bannerHTML + tableHTML + controlsHTML;

  const nextBtn = document.getElementById("revealNextBtn");
  if(nextBtn){
    nextBtn.addEventListener("click", revealNextPosition);
  }

  if(topTwoRevealed && activeResultsTab === "pintxoa" && !winnerCelebrated){
    winnerCelebrated = true;
    showFireworks();
  }
}

function updateResultsTabButtons(){
  const pintxoaBtn = document.getElementById("tabPintxoaBtn");
  const presBtn = document.getElementById("tabPresentacionBtn");

  const isPintxoa = activeResultsTab === "pintxoa";

  pintxoaBtn.setAttribute("aria-selected", String(isPintxoa));

  presBtn.classList.toggle("active", !isPintxoa);

}

function loadResultsForActiveTab(){
  hideFireworks();
  updateResultsTabButtons();

  const { votesCount, ranking } = computeRankingForTab(activeResultsTab);
  liveRankingData = ranking;
  revealedIndices = new Set();

  document.getElementById("resultsVotesCount").textContent =

  renderLiveResultsTable();

function openHistory(entry){
  document.getElementById("historyTitle").innerHTML = entry.edition;
  document.getElementById("historyDate").textContent = entry.date;
  document.getElementById("historyWinner").innerHTML = `Irabazlea: <strong>${entry.winner}</strong>`;

  const contentEl = document.getElementById("historyResults");
  const gallerySectionEl = document.getElementById("historyGallerySection");
  const galleryEl = document.getElementById("historyGallery");
  galleryEl.innerHTML = "";

  if (entry.ranking && entry.ranking.length > 0) {
    let tableHTML = `
      <table class="results-table">
        <thead>
          <tr>
            <th style="text-align:center">Posición</th>
            <th style="text-align:center">Pintxo</th>
            <th style="text-align:right">Puntuación</th>
          </tr>
        </thead>
        <tbody>
    `;
    entry.ranking.forEach(row => {
      const medalClass = row.medal ? `medal-${row.medal}` : '';
      const nameClass = row.medal === 'gold' ? 'gold-text' : '';
      tableHTML += `
        <tr class="${medalClass}">
          <td class="col-pos">${row.pos}º</td>
          <td class="col-name ${nameClass}">${row.name}</td>
          <td class="col-score">${row.score} puntos</td>
        </tr>
      `;
    });
    tableHTML += `</tbody></table>`;
    contentEl.innerHTML = tableHTML;
  } else {
    contentEl.innerHTML = `<div class="history-placeholder">No hay clasificación guardada para esta edición.</div>`;
  }

  const participantsToRender = entry.ranking && entry.ranking.length > 0 
    ? entry.ranking.map(r => r.name) 
    : (entry.participants || []);

  if (participantsToRender.length > 0) {
    gallerySectionEl.classList.remove("hidden");
    
    // Creamos un array de datos para el lightbox
    const lightboxData = [];

    participantsToRender.forEach((name, idx) => {
      const folderName = `${entry.id}Edizioa`;
      const photoName = getPhotoName(name);
      const imgSrc = `${folderName}/${photoName}1.jpeg`;
      
      lightboxData.push({ src: imgSrc, author: name });

      const card = document.createElement("div");
      card.className = "photo-card";
      card.innerHTML = `
        <div class="photo-img-wrapper">
          <img src="${imgSrc}" alt="Pintxo de ${name}" loading="lazy" onerror="this.style.display='none'; this.parentElement.innerHTML='<div style=\\'display:flex;align-items:center;justify-content:center;width:100%;height:100%;color:%238a7f70;font-size:0.85rem;font-style:italic;\\'>Foto no disponible</div>';">
        </div>
        <div class="photo-author">${name}</div>
      `;
      
      // Al hacer clic en la tarjeta, abrimos el lightbox
      card.addEventListener("click", () => {
        // Solo abrimos si la imagen está visible (no si falló la carga)
        if(!card.querySelector('img').style.display || card.querySelector('img').style.display !== 'none') {
          openLightbox(lightboxData, idx);
        }
      });

      galleryEl.appendChild(card);
    });
  } else {
    gallerySectionEl.classList.add("hidden");
  }

  showScreen(screenHistory);
}

document.getElementById("historyBackBtn").addEventListener("click", ()=>showScreen(screenHome));

/* =========================================================
   LÓGICA DEL LIGHTBOX
   ========================================================= */
const lightboxOverlay = document.getElementById("lightboxOverlay");
const lightboxImg = document.getElementById("lightboxImg");
const lightboxAuthor = document.getElementById("lightboxAuthor");
const lightboxPrevBtn = document.getElementById("lightboxPrevBtn");
const lightboxNextBtn = document.getElementById("lightboxNextBtn");
const lightboxCloseBtn = document.getElementById("lightboxCloseBtn");

let lightboxItems = [];
let lightboxCurrentIndex = 0;
let touchStartX = 0;

function openLightbox(items, startIndex) {
  lightboxItems = items;
  lightboxCurrentIndex = startIndex;
  updateLightboxView();
  lightboxOverlay.classList.add("active");
  document.body.style.overflow = "hidden"; // Evitar scroll de fondo
}

function closeLightbox() {
  lightboxOverlay.classList.remove("active");
  document.body.style.overflow = "";
}

function updateLightboxView() {
  if (lightboxItems.length === 0) return;
  
  const item = lightboxItems[lightboxCurrentIndex];
  lightboxImg.src = item.src;
  lightboxImg.alt = `Pintxo de ${item.author}`;
  lightboxAuthor.textContent = item.author;

  // Mostrar/ocultar botones de navegación según si hay más fotos
  if (lightboxItems.length > 1) {
    lightboxPrevBtn.classList.remove("hidden");
    lightboxNextBtn.classList.remove("hidden");
    
    // En el primer elemento, el botón de "anterior" no hace nada (o podríamos dar la vuelta, pero lo dejamos simple)
    lightboxPrevBtn.style.opacity = lightboxCurrentIndex === 0 ? "0.3" : "1";
    lightboxNextBtn.style.opacity = lightboxCurrentIndex === lightboxItems.length - 1 ? "0.3" : "1";
  } else {
    lightboxPrevBtn.classList.add("hidden");
    lightboxNextBtn.classList.add("hidden");
  }
}

function navigateLightbox(direction) {
  if (lightboxItems.length <= 1) return;
  const newIndex = lightboxCurrentIndex + direction;
  if (newIndex >= 0 && newIndex < lightboxItems.length) {
    lightboxCurrentIndex = newIndex;
    updateLightboxView();
  }
}

lightboxCloseBtn.addEventListener("click", closeLightbox);

// Cerrar al hacer clic fuera de la foto
lightboxOverlay.addEventListener("click", (e) => {
  if (e.target === lightboxOverlay || e.target.id === "lightboxContent") {
    closeLightbox();
  }
});

lightboxPrevBtn.addEventListener("click", () => navigateLightbox(-1));
lightboxNextBtn.addEventListener("click", () => navigateLightbox(1));

// Navegación con teclado
document.addEventListener("keydown", (e) => {
  if (!lightboxOverlay.classList.contains("active")) return;
  
  if (e.key === "Escape") closeLightbox();
  if (e.key === "ArrowLeft") navigateLightbox(-1);
  if (e.key === "ArrowRight") navigateLightbox(1);
});

// Navegación táctil (Swipe)
lightboxOverlay.addEventListener("touchstart", (e) => {
  touchStartX = e.changedTouches[0].screenX;
}, {passive: true});

lightboxOverlay.addEventListener("touchend", (e) => {
  if (!lightboxOverlay.classList.contains("active")) return;
  const touchEndX = e.changedTouches[0].screenX;
  const diff = touchEndX - touchStartX;
  
  // Si el deslizamiento es mayor a 50px, navegar
  if (Math.abs(diff) > 50) {
    if (diff > 0) {
      navigateLightbox(-1); // Deslizar a la derecha -> anterior
    } else {
      navigateLightbox(1);  // Deslizar a la izquierda -> siguiente
    }
  }
}, {passive: true});

/* =========================================================
   LÓGICA DE VOTACIÓN Y DRAG & DROP
   ========================================================= */
const pintxoListEl = document.getElementById("pintxoList");
const MEDALS = ["gold","silver","bronze"];

function renderPintxos(){
  pintxoListEl.innerHTML = "";
  const total = currentOrder.length;

  currentOrder.forEach((name, index)=>{
    const points = total - index;
    const isLocked = (currentVoter !== ABUELA) && (index === total - 1) && (name === currentVoter);
    const medal = MEDALS[index] || null;

    const item = document.createElement("div");
    item.className = "pintxo-item" + (isLocked ? " locked" : "");
    item.dataset.name = name;
    item.innerHTML = `
      ${medal ? `<span class="medal-stripe ${medal}"></span>` : ''}
      <span class="pos-num">${index+1}º</span>
      <span class="pintxo-name">${name}</span>
      ${isLocked ? '<span class="lock-tag">Bloqueado</span>' : ''}
      <span class="points">${points} pts</span>
    `;

    if(!isLocked){
      item.addEventListener("pointerdown", onPointerDown);
    }
    pintxoListEl.appendChild(item);
  });
}

let drag = null;

function onPointerDown(e){
  if(e.button !== undefined && e.button !== 0) return;
  const item = this;
  const startY = e.clientY;
  let dragging = false;

  const onMove = (ev)=>{
    if(!dragging){
      if(Math.abs(ev.clientY - startY) < 5) return;
      dragging = true;
      item.classList.add("dragging");
      item.setPointerCapture(ev.pointerId);
      drag = { el: item };
      ev.preventDefault();
    }

    const siblings = [...pintxoListEl.children].filter(el => el !== item);
    let targetSibling = null;
    for(const sib of siblings){
      if(sib.classList.contains("locked")) continue;
      const r = sib.getBoundingClientRect();
      const mid = r.top + r.height/2;
      if(ev.clientY < mid){ targetSibling = sib; break; }
    }

    if(targetSibling){
      if(item.nextElementSibling !== targetSibling){
        pintxoListEl.insertBefore(item, targetSibling);
      }
    } else {
      const lockedEl = pintxoListEl.querySelector(".pintxo-item.locked");
      if(lockedEl){
        if(item.nextElementSibling !== lockedEl){
          pintxoListEl.insertBefore(item, lockedEl);
        }
      } else {
        if(item !== pintxoListEl.lastElementChild){
          pintxoListEl.appendChild(item);
        }
      }
    }
  };

  const onUp = ()=>{
    document.removeEventListener("pointermove", onMove);
    document.removeEventListener("pointerup", onUp);
    document.removeEventListener("pointercancel", onUp);

    if(!dragging) return;
    item.classList.remove("dragging");

    const newOrder = [...pintxoListEl.children]
      .map(el => el.dataset.name)
      .filter(Boolean);

    if(currentVoter !== ABUELA){
      const idx = newOrder.indexOf(currentVoter);
      if(idx !== -1 && idx !== newOrder.length - 1){
        newOrder.splice(idx,1);
        newOrder.push(currentVoter);
      }
    }

    drag = null;
    currentOrder = newOrder;
    renderPintxos();
    updateSaveBtn();
  };

  document.addEventListener("pointermove", onMove, {passive:false});
  document.addEventListener("pointerup", onUp);
  document.addEventListener("pointercancel", onUp);
}

const presentationGridEl = document.getElementById("presentationGrid");

function renderPresentations(){
  presentationGridEl.innerHTML = "";
  const eligibleCooks = cooks.filter(name => name !== currentVoter);

  PRES_LABELS.forEach((label, i)=>{
    const cell = document.createElement("div");
    cell.className = "pres-cell" + (currentPresentations[i] ? " filled" : "");

    const lbl = document.createElement("div");
    lbl.className = "pres-label";
    lbl.innerHTML = `<span>${label}</span><span class="pres-points">${PRES_POINTS[i]} pts</span>`;
    cell.appendChild(lbl);

    const val = document.createElement("div");
    val.className = "pres-value" + (currentPresentations[i] ? "" : " empty");
    val.textContent = currentPresentations[i] || "Seleccionar";
    cell.appendChild(val);

    const select = document.createElement("select");
    const emptyOpt = document.createElement("option");
    emptyOpt.value = "";
    emptyOpt.textContent = "—";
    select.appendChild(emptyOpt);

    eligibleCooks.forEach(name=>{
      const opt = document.createElement("option");
      opt.value = name;
      opt.textContent = name;
      if(currentPresentations.includes(name) && currentPresentations[i] !== name){
        opt.disabled = true;
      }
      if(currentPresentations[i] === name) opt.selected = true;
      select.appendChild(opt);
    });

    select.addEventListener("change", ()=>{
      const chosen = select.value || null;
      if(chosen === currentVoter && currentVoter !== ABUELA) return;
      if(chosen){
        currentPresentations = currentPresentations.map((v,idx)=> idx!==i && v===chosen ? null : v);
      }
      currentPresentations[i] = chosen;
      renderPresentations();
      updateSaveBtn();
    });

    cell.appendChild(select);
    presentationGridEl.appendChild(cell);
  });
}

const saveBtn = document.getElementById("saveBtn");
function allPresentationsFilled(){
  return currentPresentations.every(v => v !== null);
}
function updateSaveBtn(){ saveBtn.disabled = !allPresentationsFilled(); }

saveBtn.addEventListener("click", ()=>{
  if(!allPresentationsFilled()) return;
  const votes = getSavedVotes();
  votes[currentVoter] = {
    order: [...currentOrder],
    presentations: [...currentPresentations],
    timestamp: new Date().toISOString()
  };
  localStorage.setItem(STORAGE_KEY, JSON.stringify(votes));
  renderVoters();
  showToast("Votación guardada");
});

let toastTimer = null;
function showToast(message = "Votación guardada"){
  const t = document.getElementById("toast");
  t.textContent = message;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove("show"), 2400);
}

renderVoters();
renderHistory();
</script>
