<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gabonetako Sari Nagusia — Votación</title>
<style>
  :root{
    --bg:#f3ece1;
    --card:#fbf7f0;
    --card2:#f6efe4;
    --accent:#c9a26b;
    --accent2:#d9b98a;
    --text:#3a342c;
    --muted:#8a7f70;
    --danger:#b07a6f;
    --ok:#8fb59a;
    --border:#e5dccd;
    --gold:#e6c878;
    --silver:#cfd3d6;
    --bronze:#d6a37a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    padding:24px 16px 80px;
  }
  h1{
    text-align:center;
    font-size:clamp(1.4rem,3vw,2.2rem);
    margin:0 0 28px;
    letter-spacing:.5px;
    color:var(--text);
  }
  h1 span{color:var(--accent);}
  .container{max-width:980px;margin:0 auto;}

  .home-layout{
    display:grid;
    grid-template-columns: 1fr 300px;
    gap:22px;
    align-items:start;
  }
  @media(max-width:760px){
    .home-layout{grid-template-columns:1fr;}
  }

  .section-title{
    font-size:.85rem;text-transform:uppercase;letter-spacing:1.5px;
    color:var(--muted);margin:0 0 12px;
  }

  .voter-grid{
    display:flex;flex-direction:column;gap:10px;
  }
  .voter-btn{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 18px;
    background:var(--card);
    border:1px solid var(--border);
    color:var(--text);
    font-size:1rem;font-weight:600;
    cursor:pointer;
    transition:transform .12s ease, border-color .12s, box-shadow .12s;
    text-align:left;
  }
  .voter-btn:nth-child(4n+1){border-radius:14px 4px 14px 4px;}
  .voter-btn:nth-child(4n+2){border-radius:4px 14px 4px 14px;}
  .voter-btn:nth-child(4n+3){border-radius:14px 4px 14px 4px;}
  .voter-btn:nth-child(4n+4){border-radius:4px 14px 4px 14px;}
  .voter-btn:hover{
    transform:translateY(-2px);
    border-color:var(--accent);
    box-shadow:0 6px 16px rgba(120,100,70,.12);
  }
  .voter-btn .arrow{color:var(--accent);font-size:1.1rem;}

  .history-list{
    display:flex;flex-direction:column;gap:10px;
  }
  .history-card{
    display:flex;flex-direction:column;gap:6px;
    padding:14px 16px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px 4px 12px 4px;
    cursor:pointer;
    transition:transform .12s, border-color .12s, box-shadow .12s;
    text-align:left;
  }
  .history-card:hover{
    transform:translateY(-2px);
    border-color:var(--accent);
    box-shadow:0 6px 16px rgba(120,100,70,.12);
  }
  .history-edition{
    font-size:1.05rem;font-weight:700;color:var(--text);
  }
  .history-winner{
    font-size:.85rem;color:var(--muted);
  }
  .history-winner strong{color:var(--accent);font-weight:700;}

  .header-bar{
    display:flex;align-items:center;gap:14px;
    margin-bottom:22px;flex-wrap:wrap;
  }
  .back-btn{
    background:transparent;
    border:1px solid var(--muted);
    color:var(--text);
    padding:8px 14px;
    border-radius:10px 3px 10px 3px;
    cursor:pointer;font-size:.9rem;
  }
  .back-btn:hover{border-color:var(--accent);color:var(--accent);}
  .voter-name{font-size:1.25rem;font-weight:700;}
  .voter-name span{color:var(--accent);}

  .vote-layout{
    display:grid;
    grid-template-columns: 1.55fr 1fr;
    gap:22px;
    align-items:start;
  }
  @media(max-width:680px){
    .vote-layout{grid-template-columns:1fr;}
  }

  .pintxo-list{
    display:flex;flex-direction:column;gap:8px;
    position:relative;
  }
  .pintxo-item{
    display:flex;align-items:center;gap:14px;
    padding:14px 16px 14px 22px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px 4px 12px 4px;
    cursor:grab;
    user-select:none;
    -webkit-user-select:none;
    touch-action:none;
    will-change:background-color, border-color;
    transition:background-color .15s, border-color .15s, box-shadow .15s;
    position:relative;
    overflow:hidden;
  }
  .pintxo-item.dragging{
    background:var(--card2);
    border-color:var(--accent);
    box-shadow:0 6px 18px rgba(120,100,70,.18);
    cursor:grabbing;
    z-index:10;
  }
  .pintxo-item.locked{
    background:#f1e6d8;
    border-color:#d8c4a8;
    cursor:not-allowed;
  }

  .medal-stripe{
    position:absolute;
    left:0;top:0;bottom:0;
    width:6px;
    border-radius:12px 0 0 4px;
  }
  .medal-stripe.gold{background:var(--gold);}
  .medal-stripe.silver{background:var(--silver);}
  .medal-stripe.bronze{background:var(--bronze);}

  .pos-num{
    min-width:26px;font-weight:700;
    color:var(--accent);font-size:1.05rem;
  }
  .pintxo-name{flex:1;font-weight:600;font-size:1.05rem;}
  .points{
    background:#ecdfc9;color:#8a6d3b;
    padding:4px 10px;
    border-radius:8px 2px 8px 2px;
    font-weight:700;font-size:.9rem;
    min-width:52px;text-align:center;
  }
  .lock-tag{
    font-size:.7rem;text-transform:uppercase;letter-spacing:1px;
    color:var(--danger);border:1px solid var(--danger);
    padding:2px 6px;border-radius:6px 2px 6px 2px;
  }

  .presentation-col{
    display:flex;flex-direction:column;
  }
  .presentation-list{
    display:flex;flex-direction:column;gap:18px;
  }
  .pres-cell{
    background:var(--card);
    border:1px dashed #d8cdbc;
    border-radius:12px 4px 12px 4px;
    padding:14px;
    min-height:64px;
    display:flex;flex-direction:column;justify-content:center;gap:6px;
    cursor:pointer;position:relative;
    transition:border-color .12s;
  }
  .pres-cell:hover{border-color:var(--accent);}
  .pres-cell.filled{
    border-style:solid;border-color:var(--accent);
    background:var(--card2);
  }
  .pres-label{
    font-size:.7rem;text-transform:uppercase;letter-spacing:1px;
    color:var(--muted);
    display:flex;justify-content:space-between;align-items:center;
  }
  .pres-points{
    background:#ecdfc9;color:#8a6d3b;
    padding:1px 6px;border-radius:6px 2px 6px 2px;
    font-weight:700;font-size:.7rem;
    letter-spacing:.5px;
  }
  .pres-value{font-weight:700;font-size:1rem;}
  .pres-value.empty{color:var(--muted);font-weight:400;font-style:italic;}
  .pres-cell select{
    position:absolute;inset:0;opacity:0;
    cursor:pointer;width:100%;height:100%;
  }

  .save-btn{
    margin-top:34px;width:100%;padding:16px;
    background:var(--accent2);color:#4a3a1f;
    font-weight:800;font-size:1.05rem;
    border:none;
    border-radius:14px 4px 14px 4px;
    cursor:pointer;
    letter-spacing:.5px;
    transition:transform .12s, box-shadow .12s, background .12s;
  }
  .save-btn:hover{
    transform:translateY(-2px);
    background:var(--accent);
    box-shadow:0 8px 20px rgba(120,100,70,.18);
  }
  .save-btn:disabled{
    opacity:.45;cursor:not-allowed;
    transform:none;box-shadow:none;
  }
  .toast{
    position:fixed;bottom:24px;left:50%;
    transform:translateX(-50%) translateY(120%);
    background:var(--ok);color:#2a3f31;
    padding:12px 22px;
    border-radius:12px 4px 12px 4px;
    font-weight:700;transition:transform .3s ease;
    z-index:50;
  }
  .toast.show{transform:translateX(-50%) translateY(0);}
  .hidden{display:none !important;}

  .history-view{
    max-width:800px;margin:0 auto;
  }
  .history-view h2{
    font-size:1.6rem;margin:0 0 6px;
  }
  .history-view h2 span{color:var(--accent);}
  .history-view .date-line{
    color:var(--muted);margin:0 0 4px;font-size:.95rem;
  }
  .history-view .winner-line{
    color:var(--muted);margin:0 0 24px;font-size:1rem;
  }
  .history-view .winner-line strong{color:var(--accent);}

  .results-table{
    width:100%;
    border-collapse:separate;
    border-spacing:0;
    margin-top:16px;
    margin-bottom:32px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px 4px 12px 4px;
    overflow:hidden;
  }
  .results-table th{
    background:var(--card2);
    color:var(--text);
    text-align:left;
    padding:14px 16px;
    font-weight:600;
    font-size:.85rem;
    text-transform:uppercase;
    letter-spacing:1px;
    border-bottom:2px solid var(--border);
  }
  .results-table th:first-child{ border-top-left-radius:12px; }
  .results-table th:last-child{ border-top-right-radius:4px; }
  
  .results-table td{
    padding:14px 16px;
    border-bottom:1px solid var(--border);
    font-size:1rem;
  }
  .results-table tr:last-child td{ border-bottom:none; }
  
  .results-table tr{ position:relative; }
  
  .results-table tr.medal-gold td:first-child{ border-left:6px solid var(--gold); }
  .results-table tr.medal-silver td:first-child{ border-left:6px solid var(--silver); }
  .results-table tr.medal-bronze td:first-child{ border-left:6px solid var(--bronze); }
  .results-table tr:not(.medal-gold):not(.medal-silver):not(.medal-bronze) td:first-child{ border-left:6px solid transparent; }

  .results-table .col-pos { font-weight:700; color:var(--muted); width: 80px; text-align:center; }
  .results-table .col-name { font-weight:600; text-align:center; color:var(--text); }
  .results-table .col-name.gold-text { color:var(--bronze); font-weight:700; }
  
  .results-table .col-score { font-weight:700; color:var(--ok); text-align:right; }

  .results-table tr:not(.medal-gold):not(.medal-silver):not(.medal-bronze) .col-name { color:var(--muted); font-weight:500; }

  /* ---------- galería de fotos cuadradas ---------- */
  .gallery-title {
    font-size:.85rem; text-transform:uppercase; letter-spacing:1.5px;
    color:var(--muted); margin: 0 0 16px;
  }
  .gallery-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 16px;
  }
  .photo-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px 4px 12px 4px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  
  /* Contenedor de la imagen cuadrado perfecto */
  .photo-img-wrapper {
    width: 100%;
    aspect-ratio: 1 / 1;
    background: var(--card2);
    border-bottom: 1px solid var(--border);
    overflow: hidden;
  }
  .photo-img-wrapper img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .photo-author {
    padding: 12px 10px;
    font-weight: 600;
    font-size: .95rem;
    text-align: center;
    background: var(--card);
  }
</style>
</head>
<body>
<div class="container">

  <section id="screen-home">
    <h1>Gabonetako <span>Sari Nagusia</span></h1>
    <div class="home-layout">
      <div class="home-main">
        <div class="section-title">Votantes</div>
        <div class="voter-grid" id="voterList"></div>
      </div>

      <aside class="home-history">
        <div class="section-title">Aurreko edizioak</div>
        <div class="history-list" id="historyList"></div>
      </aside>
    </div>
  </section>

  <section id="screen-vote" class="hidden">
    <div class="header-bar">
      <button class="back-btn" id="backBtn">Volver</button>
      <div class="voter-name">Votando: <span id="currentVoterName"></span></div>
    </div>

    <div class="vote-layout">
      <div class="pintxo-col">
        <div class="section-title">Pintxoak</div>
        <div class="pintxo-list" id="pintxoList"></div>
      </div>

      <div class="presentation-col">
        <div class="section-title">Presentaciones</div>
        <div class="presentation-list" id="presentationGrid"></div>
      </div>
    </div>

    <button class="save-btn" id="saveBtn">Guardar votación</button>
  </section>

  <section id="screen-history" class="hidden">
    <div class="header-bar">
      <button class="back-btn" id="historyBackBtn">Volver</button>
    </div>
    <div class="history-view">
      <h2 id="historyTitle"></h2>
      <p class="date-line" id="historyDate"></p>
      <p class="winner-line" id="historyWinner"></p>
      
      <div id="historyResults"></div>

      <div class="gallery-title">Fotos</div>
      <div class="gallery-grid" id="historyGallery"></div>
    </div>
  </section>

</div>

<div class="toast" id="toast">Votación guardada</div>

<script>
const ALL_VOTERS = [
  "Abuela","Josefina","Juan Mari","Jon","Mikel",
  "Ana Luisa","Javi","Iosu","Yaiza"
];
const voters = [...ALL_VOTERS].sort((a,b)=>a.localeCompare(b,"es"));
const ABUELA = "Abuela";
const cooks = [...ALL_VOTERS]
  .filter(n => n !== ABUELA)
  .sort((a,b)=>a.localeCompare(b,"es"));

function getPhotoName(name) {
  if (name === "Ana Luisa") return "AnaLuisa";
  if (name === "Juan Mari") return "JuanMari";
  return name.replace(/\s+/g, '');
}

const HISTORY = [
  { 
    id:"5", 
    edition:"V. Edizioa", 
    date:"25/12/2025",
    winner:"Jon",
    ranking: [
      { pos:1, name:"Jon", score:58, medal:"gold" },
      { pos:2, name:"Josefina", score:54, medal:"silver" },
      { pos:3, name:"Ana Luisa", score:52, medal:"bronze" },
      { pos:4, name:"Juan Mari", score:37, medal:null },
      { pos:5, name:"Mikel", score:34, medal:null },
      { pos:6, name:"Iosu", score:31, medal:null },
      { pos:7, name:"Yaiza", score:31, medal:null },
      { pos:8, name:"Javi", score:19, medal:null }
    ]
  },
];

let currentVoter = null;
let currentOrder = [];
let currentPresentations = [null,null,null];
const STORAGE_KEY = "gabonetako-votos-v1";

const voterListEl = document.getElementById("voterList");
function renderVoters(){
  voterListEl.innerHTML = "";
  voters.forEach(name=>{
    const btn = document.createElement("button");
    btn.className = "voter-btn";
    btn.innerHTML = `<span>${name}</span><span class="arrow">›</span>`;
    btn.addEventListener("click", ()=>startVote(name));
    voterListEl.appendChild(btn);
  });
}

const historyListEl = document.getElementById("historyList");
function renderHistory(){
  historyListEl.innerHTML = "";
  HISTORY.forEach(entry=>{
    const card = document.createElement("button");
    card.className = "history-card";
    card.innerHTML = `
      <div class="history-edition">${entry.edition}</div>
      <div class="history-winner">Irabazlea: <strong>${entry.winner}</strong></div>
    `;
    card.addEventListener("click", ()=>openHistory(entry));
    historyListEl.appendChild(card);
  });
}

const screenHome = document.getElementById("screen-home");
const screenVote = document.getElementById("screen-vote");
const screenHistory = document.getElementById("screen-history");

function showScreen(el){
  [screenHome, screenVote, screenHistory].forEach(s=>s.classList.add("hidden"));
  el.classList.remove("hidden");
}

function startVote(voter){
  currentVoter = voter;
  document.getElementById("currentVoterName").textContent = voter;

  currentOrder = [...cooks];
  if(voter !== ABUELA){
    currentOrder = currentOrder.filter(n => n !== voter);
    currentOrder.push(voter);
  }
  currentPresentations = [null,null,null];

  renderPintxos();
  renderPresentations();
  updateSaveBtn();
  showScreen(screenVote);
}

document.getElementById("backBtn").addEventListener("click", ()=>showScreen(screenHome));

function openHistory(entry){
  document.getElementById("historyTitle").innerHTML = entry.edition;
  document.getElementById("historyDate").textContent = entry.date;
  document.getElementById("historyWinner").innerHTML = `Irabazlea: <strong>${entry.winner}</strong>`;

  const contentEl = document.getElementById("historyResults");
  if (entry.ranking && entry.ranking.length > 0) {
    let tableHTML = `
      <table class="results-table">
        <thead>
          <tr>
            <th style="text-align:center">Posición</th>
            <th style="text-align:center">Pintxo</th>
            <th style="text-align:right">Puntuación</th>
          </tr>
        </thead>
        <tbody>
    `;
    entry.ranking.forEach(row => {
      const medalClass = row.medal ? `medal-${row.medal}` : '';
      const nameClass = row.medal === 'gold' ? 'gold-text' : '';
      tableHTML += `
        <tr class="${medalClass}">
          <td class="col-pos">${row.pos}º</td>
          <td class="col-name ${nameClass}">${row.name}</td>
          <td class="col-score">${row.score} puntos</td>
        </tr>
      `;
    });
    tableHTML += `</tbody></table>`;
    contentEl.innerHTML = tableHTML;
  } else {
    contentEl.innerHTML = `<div class="history-placeholder">Aún no hay ranking cargado para esta edición.</div>`;
  }

  const galleryEl = document.getElementById("historyGallery");
  galleryEl.innerHTML = "";
  
  if (entry.ranking) {
    entry.ranking.forEach(row => {
      const folderName = `${entry.id}Edizioa`;
      const photoName = getPhotoName(row.name);
      const imgSrc = `${folderName}/${photoName}1.jpeg`;
      
      const card = document.createElement("div");
      card.className = "photo-card";
      card.innerHTML = `
        <div class="photo-img-wrapper">
          <img src="${imgSrc}" alt="Pintxo de ${row.name}" loading="lazy" onerror="this.style.display='none'; this.parentElement.innerHTML='<div style=\\'display:flex;align-items:center;justify-content:center;width:100%;height:100%;color:%238a7f70;font-size:0.85rem;font-style:italic;\\'>Foto no disponible</div>';">
        </div>
        <div class="photo-author">${row.name}</div>
      `;
      galleryEl.appendChild(card);
    });
  }

  showScreen(screenHistory);
}

document.getElementById("historyBackBtn").addEventListener("click", ()=>showScreen(screenHome));

const pintxoListEl = document.getElementById("pintxoList");
const MEDALS = ["gold","silver","bronze"];

function renderPintxos(){
  pintxoListEl.innerHTML = "";
  const total = currentOrder.length;

  currentOrder.forEach((name, index)=>{
    const points = total - index;
    const isLocked = (currentVoter !== ABUELA) && (index === total - 1) && (name === currentVoter);
    const medal = MEDALS[index] || null;

    const item = document.createElement("div");
    item.className = "pintxo-item" + (isLocked ? " locked" : "");
    item.dataset.name = name;
    item.innerHTML = `
      ${medal ? `<span class="medal-stripe ${medal}"></span>` : ''}
      <span class="pos-num">${index+1}º</span>
      <span class="pintxo-name">${name}</span>
      ${isLocked ? '<span class="lock-tag">Bloqueado</span>' : ''}
      <span class="points">${points} pts</span>
    `;

    if(!isLocked){
      item.addEventListener("pointerdown", onPointerDown);
    }
    pintxoListEl.appendChild(item);
  });
}

let drag = null;

function onPointerDown(e){
  if(e.button !== undefined && e.button !== 0) return;
  const item = this;
  const startY = e.clientY;
  let dragging = false;

  const onMove = (ev)=>{
    if(!dragging){
      if(Math.abs(ev.clientY - startY) < 5) return;
      dragging = true;
      item.classList.add("dragging");
      item.setPointerCapture(ev.pointerId);
      drag = { el: item };
      ev.preventDefault();
    }

    const siblings = [...pintxoListEl.children].filter(el => el !== item);
    let targetSibling = null;
    for(const sib of siblings){
      if(sib.classList.contains("locked")) continue;
      const r = sib.getBoundingClientRect();
      const mid = r.top + r.height/2;
      if(ev.clientY < mid){ targetSibling = sib; break; }
    }

    if(targetSibling){
      if(item.nextElementSibling !== targetSibling){
        pintxoListEl.insertBefore(item, targetSibling);
      }
    } else {
      const lockedEl = pintxoListEl.querySelector(".pintxo-item.locked");
      if(lockedEl){
        if(item.nextElementSibling !== lockedEl){
          pintxoListEl.insertBefore(item, lockedEl);
        }
      } else {
        if(item !== pintxoListEl.lastElementChild){
          pintxoListEl.appendChild(item);
        }
      }
    }
  };

  const onUp = ()=>{
    document.removeEventListener("pointermove", onMove);
    document.removeEventListener("pointerup", onUp);
    document.removeEventListener("pointercancel", onUp);

    if(!dragging) return;
    item.classList.remove("dragging");

    const newOrder = [...pintxoListEl.children]
      .map(el => el.dataset.name)
      .filter(Boolean);

    if(currentVoter !== ABUELA){
      const idx = newOrder.indexOf(currentVoter);
      if(idx !== -1 && idx !== newOrder.length - 1){
        newOrder.splice(idx,1);
        newOrder.push(currentVoter);
      }
    }

    drag = null;
    currentOrder = newOrder;
    renderPintxos();
    updateSaveBtn();
  };

  document.addEventListener("pointermove", onMove, {passive:false});
  document.addEventListener("pointerup", onUp);
  document.addEventListener("pointercancel", onUp);
}

const presentationGridEl = document.getElementById("presentationGrid");
const PRES_LABELS = ["Mejor presentación 1","Mejor presentación 2","Mejor presentación 3"];
const PRES_POINTS = [3,2,1];

function renderPresentations(){
  presentationGridEl.innerHTML = "";
  PRES_LABELS.forEach((label, i)=>{
    const cell = document.createElement("div");
    cell.className = "pres-cell" + (currentPresentations[i] ? " filled" : "");

    const lbl = document.createElement("div");
    lbl.className = "pres-label";
    lbl.innerHTML = `<span>${label}</span><span class="pres-points">${PRES_POINTS[i]} pts</span>`;
    cell.appendChild(lbl);

    const val = document.createElement("div");
    val.className = "pres-value" + (currentPresentations[i] ? "" : " empty");
    val.textContent = currentPresentations[i] || "Seleccionar";
    cell.appendChild(val);

    const select = document.createElement("select");
    const emptyOpt = document.createElement("option");
    emptyOpt.value = "";
    emptyOpt.textContent = "—";
    select.appendChild(emptyOpt);

    cooks.forEach(name=>{
      const opt = document.createElement("option");
      opt.value = name;
      opt.textContent = name;
      if(currentPresentations.includes(name) && currentPresentations[i] !== name){
        opt.disabled = true;
      }
      if(currentPresentations[i] === name) opt.selected = true;
      select.appendChild(opt);
    });

    select.addEventListener("change", ()=>{
      const chosen = select.value || null;
      if(chosen){
        currentPresentations = currentPresentations.map((v,idx)=> idx!==i && v===chosen ? null : v);
      }
      currentPresentations[i] = chosen;
      renderPresentations();
      updateSaveBtn();
    });

    cell.appendChild(select);
    presentationGridEl.appendChild(cell);
  });
}

const saveBtn = document.getElementById("saveBtn");
function allPresentationsFilled(){
  return currentPresentations.every(v => v !== null);
}
function updateSaveBtn(){ saveBtn.disabled = !allPresentationsFilled(); }

saveBtn.addEventListener("click", ()=>{
  if(!allPresentationsFilled()) return;
  const votes = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
  votes[currentVoter] = {
    order: [...currentOrder],
    presentations: [...currentPresentations],
    timestamp: new Date().toISOString()
  };
  localStorage.setItem(STORAGE_KEY, JSON.stringify(votes));
  showToast();
});

function showToast(){
  const t = document.getElementById("toast");
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 2400);
}

renderVoters();
renderHistory();
</script>
</body>
</html>
